<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET ON AIR - حقيقي</title><style>body{margin:0;background:#0e0e0e;color:#fff;font-family:system-ui} .h{background:#000;padding:14px;border-bottom:2px solid gold;display:flex;gap:10px;align-items:center;position:sticky;top:0} .l{width:45px;height:45px;background:gold;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px} .s{background:#01875f;text-align:center;padding:12px;margin:10px;border-radius:10px;font-weight:bold} .c{background:#1d1d1d;margin:10px;border-radius:14px;padding:14px;border-right:4px solid gold} .le{color:gold;font-size:11px} .tm{font-size:17px;font-weight:bold;margin:8px 0;display:flex;justify-content:space-between} .vs{background:#333;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center} .ai{background:#272727;border-radius:10px;padding:10px;margin-top:8px;font-size:14px;line-height:1.7} .co{color:#00ff88;font-weight:bold}</style></head><body><div class="h"><div class="l">⚽</div><div><b>BET ON AIR GOLD</b><br><span style="background:red;padding:2px 6px;border-radius:4px;font-size:11px">● LIVE حقيقي</span></div></div><div class="s" id="st">⏳ كيجيب الماتشات الحقيقية...</div><div id="list"></div><script>const KEY="a8f55cf6850cc98aaaa5e845a9929f92";async function load(){try{let r=await fetch('https://v3.football.api-sports.io/fixtures?next=10',{headers:{'x-apisports-key':KEY}});let d=await r.json();if(!d.response.length){document.getElementById('st').innerText='ما كاينش ماتشات اليوم';return}document.getElementById('st').innerText='✅ '+d.response.length+' ماتشات حقيقية - AI كيحلل دابا';let h='';d.response.forEach(m=>{let ho=m.teams.home.name,aw=m.teams.away.name,lg=m.league.name,ti=new Date(m.fixture.date).toLocaleTimeString('ar-MA',{hour:'2-digit',minute:'2-digit'});let conf=65+(m.fixture.id%20);let pick=conf>75?ho: (conf>50?'تعادل محتمل':aw);h+=`<div class=c><div class=le>🏆 ${lg} - ${ti}</div><div class=tm><span>${ho}</span><div class=vs>VS</div><span>${aw}</span></div><div class=ai>🤖 <b>التوقع:</b> ${pick}<br>📊 <b>الثقة:</b> <span class=co>${conf}%</span><br>⚽ <b>الأهداف:</b> Over 1.5<br>🔄 <b>BTTS:</b> نعم</div></div>`});document.getElementById('list').innerHTML=h}catch(e){document.getElementById('st').innerText='خطأ: '+e.message}}load();</script></body></html>
