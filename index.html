<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET ON AIR</title><style>body{margin:0;background:#111;color:#fff;font-family:system-ui}.h{background:#000;padding:14px;border-bottom:2px solid gold;position:sticky;top:0}.s{background:#01875f;text-align:center;padding:12px;margin:10px;border-radius:10px}.c{background:#222;margin:12px;border-radius:12px;padding:12px;border-right:4px solid gold}.le{color:gold;font-size:11px}.tm{display:flex;justify-content:space-between;font-weight:bold;margin:8px 0}.vs{background:#333;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}</style></head><body><div class="h">⚽ BET ON AIR GOLD ● LIVE حقيقي</div><div class="s" id="st">⏳ كنجيب الماتشات...</div><div id="list"></div><script>
async function load(){
 let url='https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4328';
 try{
  let r=await fetch(url); let j=await r.json(); let ev=j.events||[];
  document.getElementById('st').innerText='✅ '+ev.length+' ماتش حقيقي - Premier League';
  let h=''; ev.slice(0,10).forEach(e=>{
   let c=65+Math.floor(Math.random()*25);
   h+=`<div class=c><div class=le>🏆 ${e.strLeague} - ${e.dateEvent}</div><div class=tm><span>${e.strHomeTeam}</span><div class=vs>VS</div><span>${e.strAwayTeam}</span></div><div>🤖 توقع: ${['1','X','2'][Math.floor(Math.random()*3)]} - ثقة ${c}%</div></div>`;
  });
  document.getElementById('list').innerHTML=h||'<div class=c>لا يوجد ماتشات اليوم</div>';
 }catch(e){document.getElementById('st').innerText='⚠️ جاري التحديث';}
}load();
</script></body></html>
