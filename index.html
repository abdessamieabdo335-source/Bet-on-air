<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مباريات الغد</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:10px}#app{max-width:420px;margin:auto;border:2px solid #00ff88;border-radius:15px;padding:15px;background:#111}select{width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:10px;font-weight:bold}input{width:44%;padding:12px;border-radius:10px;border:none;margin:5px;text-align:center;font-weight:bold}button{background:#00ff88;color:#000;padding:14px;border:none;border-radius:12px;width:100%;font-size:18px;font-weight:bold;margin:10px 0;cursor:pointer}.logos{display:flex;justify-content:space-around;align-items:center;margin:15px 0}.logos div{text-align:center}.logos img{width:80px;height:80px;border-radius:50%;border:3px solid #fff;background:#fff;object-fit:cover}.circle{width:80px;height:80px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#000;border:3px solid #fff}.res{background:#000;border:1px solid #333;border-radius:12px;padding:15px;text-align:center;margin-top:10px}.wa{background:#25D366;color:#fff}.match{font-size:12px;color:#aaa}</style></head><body>
<div id="app">
<select id="sel"></select>
<div style="display:flex;justify-content:center"><input id="h" value="Germany"><input id="a" value="Serbia"></div>
<button onclick="pred()">🔮 توقع النتيجة المضبوطة</button>
<div class="logos"><div><div class="circle" id="c1">DE</div><img id="i1" style="display:none"><br><span id="n1">Germany</span></div><div>vs</div><div><div class="circle" id="c2">RS</div><img id="i2" style="display:none"><br><span id="n2">Serbia</span></div></div>
<div class="res" id="r"></div>
<button class="wa" onclick="window.open('https://wa.me/212600000000?text=بغيت اشتراك 50DH','_blank')">💬 اشتراك واتساب 50DH</button>
<div id="list"></div>
</div>
<script>
const MATCHES=[
{h:"Germany",a:"Serbia",c1:"de",c2:"rs",t:"20:45"},
{h:"Greece",a:"Netherlands",c1:"gr",c2:"nl",t:"20:45"},
{h:"Denmark",a:"Portugal",c1:"dk",c2:"pt",t:"20:45"},
{h:"Wales",a:"Norway",c1:"gb-wls",c2:"no",t:"20:45"},
{h:"Israel",a:"Kosovo",c1:"il",c2:"xk",t:"20:45"},
{h:"Ireland",a:"Austria",c1:"ie",c2:"at",t:"20:45"},
{h:"Malta",a:"Gibraltar",c1:"mt",c2:"gi",t:"20:45"},
{h:"Azerbaijan",a:"Liechtenstein",c1:"az",c2:"li",t:"18:00"},
{h:"Japan",a:"Ecuador",c1:"jp",c2:"ec",t:"11:10"},
{h:"New Zealand",a:"Panama",c1:"nz",c2:"pa",t:"12:00"}
];
const sel=document.getElementById('sel');
MATCHES.forEach((m,i)=>{let o=document.createElement('option');o.value=i;o.text=`${m.h} vs ${m.a} - UEFA Nations League ${m.t}`;sel.appendChild(o);});
function flag(c){return `https://flagcdn.com/w80/${c}.png`;}
function pred(){
 let idx=sel.value||0;let m=MATCHES[idx];
 let h=document.getElementById('h').value||m.h;let a=document.getElementById('a').value||m.a;
 document.getElementById('n1').innerText=h;document.getElementById('n2').innerText=a;
 let f1=flag(m.c1),f2=flag(m.c2);
 document.getElementById('i1').src=f1;document.getElementById('i1').style.display='block';document.getElementById('c1').style.display='none';
 document.getElementById('i2').src=f2;document.getElementById('i2').style.display='block';document.getElementById('c2').style.display='none';
 let htft=["1/1","X/1","2/2","X/X","X/2"];let k=htft[Math.floor(Math.random()*htft.length)];
 let scores={"1/1":["2-0","2-1","1-0"],"X/1":["2-1","1-0"],"2/2":["0-2","1-2"],"X/X":["1-1","0-0"],"X/2":["0-1","1-2"]};
 let s=scores[k][Math.floor(Math.random()*scores[k].length)];
 let odd=(2.5+Math.random()*2.5).toFixed(2);
 let tomorrow="01-10-2026";
 document.getElementById('r').innerHTML=`<div style="color:#00ff88;font-weight:bold">- ${h} vs ${a}</div><div style="color:#00ff88">غدا ${tomorrow}</div><br><div style="color:#00ff88">HT/FT: <b style="color:yellow;font-size:22px">${k}</b></div><div style="font-size:48px;color:#00ff88;font-weight:bold">${s} <span style="font-size:18px">:النتيجة</span></div><div style="margin-top:10px">ثقة 96% | Odd: ${odd}</div>`;
}
sel.onchange=()=>{let m=MATCHES[sel.value];document.getElementById('h').value=m.h;document.getElementById('a').value=m.a;pred();}
pred();
</script></body></html>
